# Frontend virtual host for the extraction review platform.
# Serves the built SPA and proxies API calls to the `api` compose service,
# including the unbuffered SSE batch-progress stream.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped by the backend (EXTRACTION_MAX_UPLOAD_BYTES, 25 MiB
    # by default); keep a small margin here.
    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE batch progress stream: response buffering must stay disabled or
    # progress events stall inside the proxy.
    location ~ ^/api/projects/[^/]+/batches/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
