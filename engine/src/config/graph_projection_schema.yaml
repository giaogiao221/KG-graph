# KGchouqu graph projection schema v24.5.36-zh
version: v24.5.38-zh-schema
principles:
  - 边使用稳定中文动词，不使用无限扩张的属性名。
  - 一级属性和二级属性作为中文节点/属性保留。
  - 英文书籍中，主体、尾实体、证据保留原文；关系、属性、类别、事实标签统一中文。
  - 数值默认隐藏在事实节点或边属性中，不作为可视化主节点。
node_labels:
  entity: [材料, 概念, 工艺, 方法, 样品, 配方, 参数]
  fact: [属性事实, 组成事实, 应用事实, 工艺事实, 方法事实, 影响事实, 关系事实, 条件事实]
  attribute: [属性项]
  category: [属性类别]
edge_verbs:
  has_property: 具有
  has_component: 包含
  applied_to: 应用于
  used_for: 用于
  defined_as: 定义为
  belongs_to: 属于
  alias_of: 别名为
  produced_by: 通过
  test_by: 采用
  affects: 影响
  satisfies: 满足
projection:
  属性事实: "(:实体)-[:具有]->(:属性事实)-[:属性项]->(:属性项)-[:归属]->(:属性类别)"
  组成事实: "(:实体)-[:包含]->(:组成事实)-[:组分]->(:实体|属性项)"
  应用事实: "(:实体)-[:应用于]->(:应用事实|应用对象)"
  方法事实: "(:实体)-[:采用]->(:方法事实)-[:属性项]->(:属性项)-[:归属]->(:属性类别)"
  关系事实: "(:实体)-[:定义为|属于|别名为]->(:实体|概念|文本值)"
  条件事实: "不单独作为普通图谱事实；应进入条件文本或条件事实。"
value_policy:
  default: 默认隐藏
  store_fields: [取值文本, 数值, 单位, 条件文本, 证据文本, 来源事实ID]
